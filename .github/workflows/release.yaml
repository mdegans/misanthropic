# Release pipeline: multi-arch sandbox image to Docker Hub, then the crates to
# crates.io. The workspace version is the single source of truth
# (DEFAULT_IMAGE and the justfile read the same field).
#
# **Releasing is merging a version bump.** On every push to `main` the
# `version` job reads the workspace version; if tag `v<version>` does not
# exist yet, it creates it on that commit and this same run publishes. No
# hand tagging, no publishing from a laptop. (It has to be one run: a tag
# pushed with the workflow's GITHUB_TOKEN deliberately triggers no further
# workflows.) Pushing a `v*` tag by hand still works and must match the
# workspace version. A main push that doesn't change the version does nothing
# here. A release re-runs the live suite (live.yaml) on the exact commit it
# publishes and stops if it fails, so what gets released is what was tested.
#
# The image publishes before the crates so a freshly published crate's
# DEFAULT_IMAGE (`mdegans/misan-bashd:<version>`) is already pullable. Each
# arch builds on a native runner (QEMU cross-builds of rustc are painfully
# slow) and pushes an arch tag; a merge job stitches them into one manifest.
#
# `workflow_dispatch` rebuilds and pushes the image only — never the crates.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN. crates.io needs no secret:
# publish-crates uses trusted publishing (GitHub OIDC -> a short-lived
# crates.io token, revoked when the job ends), so there is no long-lived
# token to expire. One-time setup per crate on crates.io (misanthropic and
# misanthropic-derive): Settings -> Trusted Publishing -> GitHub, owner
# `mdegans`, repository `misanthropic`, workflow `release.yaml`.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Two merges in quick succession must not race to tag and publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: mdegans/misan-bashd

jobs:
  # Read the workspace version and decide whether this run releases:
  #  - a `v*` tag push releases iff the tag matches the version exactly (a
  #    mistagged release fails before anything publishes);
  #  - a push to main releases iff `v<version>` doesn't exist yet, and tags
  #    the commit first;
  #  - workflow_dispatch never releases (image rebuild only).
  version:
    runs-on: ubuntu-latest
    permissions:
      # Pushing the release tag.
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: meta
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Decide whether this run releases (and tag it if from main)
        id: decide
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              [ "$GITHUB_REF_NAME" = "$TAG" ] || {
                echo "::error::tag $GITHUB_REF_NAME != $TAG (workspace version)"
                exit 1
              }
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            push:branch)
              # The commit the tag points at (the peeled `^{}` line for an
              # annotated tag, else the lightweight tag's own line).
              TAGGED=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
                | sort -k2 | tail -1 | cut -f1)
              if [ -n "$TAGGED" ] && [ "$TAGGED" = "$GITHUB_SHA" ]; then
                # A re-run of a release that already tagged this commit
                # (cancelled or failed after tagging): carry on. The image
                # push is idempotent; a crate version already on crates.io
                # makes `cargo publish` fail loudly, never twice.
                echo "$TAG already points at $GITHUB_SHA; re-running the release."
                echo "release=true" >> "$GITHUB_OUTPUT"
              elif [ -n "$TAGGED" ]; then
                echo "$TAG already exists (at $TAGGED); nothing to release."
                echo "release=false" >> "$GITHUB_OUTPUT"
              else
                git tag "$TAG" "$GITHUB_SHA"
                git push origin "refs/tags/$TAG"
                echo "Tagged $TAG at $GITHUB_SHA; releasing."
                echo "release=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # The live suite (real API calls) and coverage on the exact commit being
  # released. Nothing is built or published unless it passes: the PR gate
  # tested the PR's head, and the squash commit on main is only the same code
  # if the PR was up to date when it merged. One paid run per release, not
  # per merge. It also refreshes the `live` coverage flag on main.
  live:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/live.yaml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read
      # Requested by live.yaml's `unlabel` job, which never runs on this path.
      pull-requests: write

  # One native build per arch, pushed as an arch tag the merge job consumes.
  # A release needs the live suite green; a manual image rebuild skips it
  # (and `!cancelled()` is what lets that path run past the skipped `live`).
  build-image:
    needs: [version, live]
    if: >-
      !cancelled() && (
      (needs.version.outputs.release == 'true' && needs.live.result == 'success') ||
      github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}

  # Stitch the arch tags into one multi-arch manifest. Prereleases get only
  # the exact-version tag; releases also move `<major.minor>` and `latest`.
  merge-image:
    needs: [version, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        run: |
          VERSION=${{ needs.version.outputs.version }}
          TAGS="-t $IMAGE:$VERSION"
          if [ "${{ needs.version.outputs.prerelease }}" = "false" ]; then
            TAGS="$TAGS -t $IMAGE:${{ needs.version.outputs.minor }} -t $IMAGE:latest"
          fi
          docker buildx imagetools create $TAGS \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  # Publish misanthropic-derive then misanthropic (--workspace resolves the
  # order and skips the publish = false members). The image is live by now,
  # so the crate's DEFAULT_IMAGE resolves from the first install.
  publish-crates:
    if: needs.version.outputs.release == 'true'
    needs: [version, merge-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token crates.io exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Trusted publishing: the token is minted for this job and revoked by
      # the action's post step. The previous CARGO_REGISTRY_TOKEN secret
      # expired (403 on the alpha.19 publish), which this retires.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace
