# Credit to GitHub Copilot for generating this file
name: Rust CI

# The full suite runs on PRs, which are the gate (with live.yaml, a required
# check). A push to main re-ran all of it on a tree the PR already passed
# (#115, #137), so on push only the cheap `main-lint` job runs: it keeps
# the README badge reporting main. coverage-main.yaml runs main's tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push superseding a PR head cancels the now-stale run instead of
# overlapping it (main pushes keep their own group per sha and never cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Push to main only: a quick check that the merged tree still lints, in
  # case main moved under the PR. The tests are coverage-main.yaml's.
  main-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-features --all-targets

  # Prove the workspace is *publishable* before anything is tagged — the
  # missing-version-on-path-dep class of failure (#133, repeated at
  # alpha.9) only surfaces at `cargo publish` time otherwise. Dry-run
  # packages and verifies every publishable member without touching
  # crates.io.
  publish-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `--locked` so a stale committed lockfile (the alpha.10 failure —
      # the image build's --locked tripped on it) also fails here.
      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run --locked

  # Build the `bashd` daemon as a static linux-musl binary (the artifact the
  # `DockerSandbox` injects into a container) and run its unit tests.
  bashd-musl:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static bashd
        run: cargo build -p bashd --release --target x86_64-unknown-linux-musl

      - name: Test bashd
        run: cargo test -p bashd --verbose

  build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing shouldn't cancel the others — the surviving legs are
      # the signal for whether a failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --all-features --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-features

      # Never combined with --all-features, which overrides it (#143). The
      # lib-only clippy is the featureless build; see `just test-no-default`.
      - name: Clippy Without Default Features
        run: cargo clippy -p misanthropic --no-default-features

      - name: Test Without Default Features
        run: cargo test -p misanthropic --verbose --no-default-features

      - name: Test With all Features
        run: cargo test --all-features --verbose

      # Test every feature individually so a missing cfg-gate can't hide
      # behind feature unification. The list comes from the [features] table
      # itself (the authoritative set, per CLAUDE.md) so it can't go stale.
      # Ubuntu only: a missing cfg-gate is not OS-specific, and this loop was
      # the long pole on every leg (Windows 39 min, macOS 20, Ubuntu 13).
      # macOS and Windows still build and run the all-features and
      # no-default-features suites, which is where OS-specific breakage shows.
      #
      # Each feature links its own test binaries, which filled the runner's
      # disk by the last feature: build them without debug info, and drop the
      # crate's own artifacts when free space runs low. Not after every
      # feature: many features (those already in `default`, plus the dev
      # self-dependency's `log`/`chat`) build the same feature set, and a
      # clean would throw that reuse away (~4 min on this leg).
      - name: Test each feature individually
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          features=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "misanthropic")
                   | .features | keys[]' |
            grep -vxE 'default|__skills')
          for f in $features; do
            echo "::group::feature: $f"
            cargo test -p misanthropic --features "$f" || exit 1
            # Under 4 GiB free: clear this crate's artifacts (deps stay).
            if [ "$(df --output=avail -k . | tail -1)" -lt 4194304 ]; then
              cargo clean -p misanthropic
            fi
            echo "::endgroup::"
          done

      # Doc-tests the agent skill files so their code blocks can't drift from
      # the public API. Runs only the doctests (the skills module is doc-only).
      - name: Test Skill Docs
        run: cargo test -p misanthropic --features __skills --doc --verbose

      # The live (--run-ignored, real API) suite and coverage are in
      # live.yaml: they run before merge, gated on the `ready-to-merge`
      # label, as a required check, instead of after the merge here.

  # The one check to require in the ruleset (#150): a matrix's job names are
  # awkward to require one by one. Event-aware, so a skipped job only passes
  # when it belongs to the other event: a PR needs every PR job to succeed,
  # a push needs `main-lint`. `!cancelled()` rather than `always()` so a run
  # superseded by the concurrency group doesn't post red.
  # Keep `needs` and the checks below listing every other job in this file.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [main-lint, publish-dry-run, bashd-musl, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require this event's jobs to succeed
        if: >-
          (github.event_name == 'pull_request' && (
            needs.build.result != 'success' ||
            needs.publish-dry-run.result != 'success' ||
            needs.bashd-musl.result != 'success')) ||
          (github.event_name == 'push' &&
            needs.main-lint.result != 'success')
        run: exit 1
